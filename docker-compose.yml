services:
  monitor:
    build: .
    image: cienciaviva-monitor
    container_name: cienciaviva-monitor
    restart: always
    env_file: .env
    environment:
      - TZ=Europe/Lisbon
      - PYTHONPATH=/hetznercheck
      - HEARTBEAT_DB=/app/heartbeats/heartbeats.db
    volumes:
      - ./data:/data
      - ../HetznerCheck:/hetznercheck:ro            # heartbeat module
      - heartbeats_data:/app/heartbeats             # shared liveness DB (read/write)
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  heartbeats_data:
    external: true                                  # created by homeserver docker-compose
    name: homeserver_heartbeats_data
